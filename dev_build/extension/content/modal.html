<div class="yoink-modal">
  <header class="yoink-header">
    <button class="yoink-close" title="Close">&times;</button>
    <span class="yoink-title">YOINK.AI</span>
  </header>

  <main class="yoink-body">
    <!-- Controls Section -->
    <section class="yoink-controls">
      <div class="yoink-control-grid">
        <div class="yoink-left-controls">
          <div class="yoink-control-row">
            <button class="yoink-btn yoink-btn-primary" id="btn-try-another">Try Another Table</button>
            <button class="yoink-btn yoink-btn-primary" id="btn-manual-select">Manual Select</button>
          </div>
          <div class="yoink-control-row">
            <button class="yoink-btn yoink-btn-secondary" id="btn-locate-next">Locate Next Button</button>
            <button class="yoink-btn yoink-btn-primary" id="btn-start-crawl">Start Crawling</button>
          </div>
          <label class="yoink-checkbox">
            <input type="checkbox" id="chk-infinite-scroll" />
            <span>Infinite Scroll</span>
          </label>
          <div class="yoink-delay-inputs">
            <div class="yoink-delay-row">
              <span>Max Pages</span>
              <input type="number" value="10" min="1" max="100" id="input-max-pages" />
              <span>pages</span>
            </div>
            <div class="yoink-delay-row">
              <span>Min Delay</span>
              <input type="number" value="1" min="0" id="input-min-delay" />
              <span>sec</span>
            </div>
            <div class="yoink-delay-row">
              <span>Max Delay</span>
              <input type="number" value="20" min="0" id="input-max-delay" />
              <span>sec</span>
            </div>
          </div>
        </div>
        <div class="yoink-export-buttons">
          <button class="yoink-btn yoink-btn-export" id="btn-csv">CSV</button>
          <button class="yoink-btn yoink-btn-export" id="btn-xlsx">XLSX</button>
          <button class="yoink-btn yoink-btn-export" id="btn-json">JSON</button>
          <button class="yoink-btn yoink-btn-export" id="btn-copy">COPY ALL</button>
        </div>
      </div>
    </section>

    <!-- Crawl Progress (hidden by default) -->
    <section class="yoink-crawl-progress" id="crawl-progress" style="display: none;">
      <div class="yoink-progress-info">
        <span id="crawl-status">Crawling...</span>
        <span id="crawl-stats">Page 1 | 0 rows</span>
      </div>
      <button class="yoink-btn yoink-btn-warning" id="btn-stop-crawl">Stop Crawling</button>
    </section>

    <!-- Action Row -->
    <section class="yoink-action-row">
      <button class="yoink-btn yoink-btn-ai" id="btn-ai-clean">✨ CLEAN WITH AI</button>
      <button class="yoink-btn yoink-btn-export" id="btn-html">📄 Download Full Page HTML</button>
    </section>

    <!-- AI Smart Extract Section -->
    <section class="yoink-smart-extract">
      <div class="yoink-smart-extract-row">
        <input type="text" id="input-ai-prompt" class="yoink-ai-prompt-input" placeholder="Describe what to extract: 'titles, prices, ratings'..." />
        <button class="yoink-btn yoink-btn-ai yoink-btn-smart" id="btn-smart-extract">Smart Extract</button>
      </div>
    </section>

    <!-- Data Table -->
    <section class="yoink-table-container">
      <div class="yoink-empty-state">
        Click 'Try Another Table' or 'Manual Select' to begin
      </div>
    </section>

    <!-- Footer -->
    <footer class="yoink-footer">
      <span class="yoink-row-count">No data loaded</span>
    </footer>
  </main>
</div>
